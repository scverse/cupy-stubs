[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cupy-stubs"
description = "Type stubs for CuPy"
readme = "README.md"
license = "MPL-2.0"
maintainers = [
  { name = "Phil A.", email = "philipp.angerer@scverse.org" },
]
authors = [
  { name = "Phil A." },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [ "scipy-stubs" ]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://github.com/scverse/cupy-stubs#readme"
urls.Homepage = "https://github.com/scverse/cupy-stubs"
urls.Source = "https://github.com/scverse/cupy-stubs"

[dependency-groups]
# without `cupy`: `hatch test` installs the right GPU platform package via `ci/install-cupy.py`
test = [
  "h5py",
  "pytest",
  "scipy",
  "typing-extensions; python_version<'3.11'", # `assert_type`
  "zarr",
]
typecheck = [ "mypy" ]

[tool.hatch]
version.source = "vcs"
build.targets.wheel.packages = [ "src/cupy-stubs", "src/cupyx-stubs" ]
build.targets.sdist.exclude = [ "/ci", "/docs", "/tests" ]
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]
envs.hatch-test.post-install-commands = [ "python ci/install-cupy.py" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.10", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "test" ]
envs.stubtest.dev-mode = false
envs.stubtest.post-install-commands = [ "python ci/install-cupy.py" ]
envs.stubtest.scripts.check = """\
  python -m mypy.stubtest cupy cupyx --ignore-missing-stub --mypy-config-file=pyproject.toml \
  --allowlist=ci/stubtest-allowlist.txt\
  """
envs.stubtest.dependency-groups = [ "test", "typecheck" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "CPY",    # enforce copyright notice
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*.pyi" = [ "UP035" ]  # `typing.Self` etc. resolve to `Any` for users on older Pythons
lint.per-file-ignores."tests/*" = [ "D" ]
lint.flake8-copyright.notice-rgx = "SPDX-License-Identifier: MPL-2\\.0"
lint.isort.known-first-party = [ "cupy", "cupyx" ]
lint.pydocstyle.convention = "numpy"
per-file-target-version."*.pyi" = "py313"  # type checkers parse stubs with the newest syntax

[tool.mypy]
files = [ "ci", "src", "tests" ]
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = true
untyped_calls_exclude = [ "h5py" ]
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
strict = true
overrides = [ { module = [ "h5py", "h5py.*" ], follow_untyped_imports = true, implicit_reexport = true } ]

[tool.ty]
# stubs use 3.13 syntax (ty has no per-file version), and `requires-python` would make it assume 3.10
environment.python-version = "3.13"

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
filterwarnings = [ "error" ]
strict = true
testpaths = [ "tests" ]

[tool.cruft]
skip = [ ".git", "tests", "docs", "src" ]
