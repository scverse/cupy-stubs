name: Test

# Runs on a GPU runner provisioned by Cirun (see `.cirun.yml`).
# To save costs, PRs only run when they have the `run-gpu-ci` label.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: "-v --color=yes"
  FORCE_COLOR: "1"
  UV_HTTP_TIMEOUT: 120

jobs:
  check-label:
    name: Check Label
    runs-on: ubuntu-slim
    steps:
      - uses: flying-sheep/check@e10bb11109d1434ab16729bd988d78d65d47e163 # v1.0.5
        with:
          success: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}

  test:
    name: GPU Tests
    needs: check-label
    runs-on: "cirun-aws-gpu--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Check NVIDIA SMI
        run: nvidia-smi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true # "auto" is `false` on non-GitHub runners
      - name: Run tests in all hatch environments
        run: uvx hatch test --all # `ci/install-cupy.py` picks `cupy-cuda13x` here
      - name: Check stubs against the runtime
        run: uvx hatch run stubtest:check

  # so the next push to the PR doesn’t trigger another expensive run
  remove-label:
    name: Remove “run-gpu-ci” Label
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --remove-label run-gpu-ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
