name: Test

# Runs on a GPU runner provisioned by Cirun (see `.cirun.yml`).
# To save costs, PRs only run when they have the `run-gpu-ci` label.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: "-v --color=yes"
  FORCE_COLOR: "1"
  UV_HTTP_TIMEOUT: 120

jobs:
  check-label:
    name: Check Label
    runs-on: ubuntu-slim
    steps:
      - uses: flying-sheep/check@e10bb11109d1434ab16729bd988d78d65d47e163 # v1.0.5
        with:
          success: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}

  test:
    name: GPU Tests
    needs: check-label
    runs-on: "cirun-aws-gpu--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Check NVIDIA SMI
        run: nvidia-smi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14" # creates and activates a venv
          enable-cache: true # "auto" is `false` on non-GitHub runners
      - name: Install package
        run: uv pip install --group=test -e . cupy-cuda13x --extra-index-url=https://pypi.nvidia.com --index-strategy=unsafe-best-match
      - name: List installed packages
        run: uv pip list
      - name: Run tests
        run: pytest

  # so the next push to the PR doesn’t trigger another expensive run
  remove-label:
    name: Remove “run-gpu-ci” Label
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --remove-label run-gpu-ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
